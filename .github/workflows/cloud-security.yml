name: Cloud security pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  iac-static-scan:
    name: "Stage 1: Static IaC scan (Checkov + tfsec)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: terraform fmt and validate
        working-directory: terraform/baseline
        run: |
          terraform fmt -check -diff -recursive
          terraform init -backend=false -input=false
          terraform validate

      # Fails the build on any finding that isn't suppressed. Seeded
      # misconfigurations that aren't fixed yet are suppressed inline on
      # their own resource ("VULN #n seeded ... fix pending"); the fix
      # commit deletes the suppression, so from then on CI guards the fix.
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/baseline
          framework: terraform
          config_file: .checkov.yaml
          soft_fail: false

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/baseline
          version: v1.28.14

  secret-scan:
    name: "Stage 2: Secret scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: deploy the baseline to a local AWS emulator (Moto) inside the
  # runner and read every seeded control back through the AWS API. No AWS
  # account or credentials are involved anywhere in this project. See
  # docs/ci-pipeline.md for what this does and doesn't prove.
  emulator-posture-check:
    name: "Stage 3: Deploy to emulator + posture checks (Moto)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Moto
        run: pip install -r tools/requirements.txt

      - name: Apply to Moto and check posture
        run: tools/local_check.sh
