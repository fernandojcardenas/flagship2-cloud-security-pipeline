name: Cloud security pipeline

on:
  push:
  pull_request:

jobs:
  iac-static-scan:
    name: "Stage 1: Static IaC scan (Checkov + tfsec)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/baseline
          framework: terraform
          config_file: .checkov.yaml
          soft_fail: false

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/baseline

  secret-scan:
    name: "Stage 2: Secret scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: Live cloud posture scan (Prowler), checking the actually
  # provisioned AWS account against the CIS AWS Foundations Benchmark.
  # Disabled (if: false) until AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  # are added as repo secrets for a dedicated, tightly scoped read-only
  # scanning user — see docs/ci-pipeline.md for why this stage is gated
  # separately from the other two, which need no live account at all.
  cloud-posture-scan:
    name: "Stage 3: Live cloud posture scan (Prowler)"
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run Prowler
        run: |
          pip install prowler
          prowler aws --compliance cis_2.0_aws
