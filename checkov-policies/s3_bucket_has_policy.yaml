# Custom Checkov policy for VULN #4 (part 1 of 2): every S3 bucket must have
# a bucket policy attached. Part 2 (s3_policy_requires_tls.py) checks what
# that policy says. Checkov's own TLS check (CKV_AWS_379) only looks at
# aws_s3_bucket_acl resources, which this project doesn't use.
metadata:
  id: "CKV2_F2_1"
  name: "Ensure every S3 bucket has a bucket policy attached"
  category: "NETWORKING"
definition:
  cond_type: connection
  resource_types:
    - aws_s3_bucket
  connected_resource_types:
    - aws_s3_bucket_policy
  operator: exists
